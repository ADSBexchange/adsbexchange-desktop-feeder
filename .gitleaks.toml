# gitleaks settings for tools/security-scan.ps1: the default rules, minus paths that aren't ours.
[extend]
useDefault = true

[[allowlists]]
description = "Upstream sources and build output: not in git, cloned or generated by the build"
paths = [
  '''native/third_party/''',
  '''(^|/)build/''',
  '''(^|/)\.gradle/''',
  '''(^|/)\.kotlin/''',
  '''^Releases/''',
  '''^tools/testdata/''',
]
