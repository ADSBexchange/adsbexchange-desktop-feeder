name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For help getting set up, ask on ADS-B Exchange's Discord server (Settings > Help in the app).
        Security problems go through the Security tab, not an issue (see SECURITY.md).

        Please don't attach `readsb.log` or files from the log folder: they include your feeder's ID and your receiver's location. A maintainer will ask for what's needed privately.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings > About.
      placeholder: "0.5.20"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: stick
    attributes:
      label: RTL-SDR stick
      description: Make and model, and any amplifier or filter between it and the antenna.
      placeholder: "ADS-B Exchange stick, no amplifier"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include any message the app showed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
