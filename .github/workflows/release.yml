# For a version tag (v1.2.3):
# - check: the tag matches the app's version and is on master;
# - build: the same build as pull requests (native programs, spike test, unit tests), no secrets;
# - sign: once a maintainer approves the `release` environment, builds the installer from the same
#   native programs and signs it through Azure Artifact Signing, signing in with GitHub's OIDC token
#   (no stored credential);
# - publish: attests the signed installer's provenance and creates a draft GitHub release with it.
# A maintainer edits the draft's notes and publishes it; the app's update check ignores drafts.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag matches appVersion and is on master
        id: check
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=app/build.gradle.kts::tag $GITHUB_REF_NAME doesn't match appVersion $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on master"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME matches appVersion $version and is on master"

      # What the `release` environment's reviewer checks before approving the signing job: the
      # tagged commit, whether it is master's head, and the merged pull request it came from.
      - name: Summary for the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          master=$(git rev-parse origin/master)
          if [ "$master" = "$GITHUB_SHA" ]; then head='yes'; else head="no: master is at $master"; fi
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base master --search "$GITHUB_SHA" \
            --json number,title,mergedBy --jq '.[] | "#\(.number) \(.title), merged by \(.mergedBy.login)"' | paste -sd ';' -)
          {
            echo '### Tag'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Tag | $GITHUB_REF_NAME, pushed by $GITHUB_ACTOR |"
            echo "| Commit | $GITHUB_SHA |"
            echo "| Head of master | $head |"
            echo "| Merged pull request | ${prs:-none found} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  sign:
    name: Signed installer
    needs: [check, build]
    runs-on: windows-2025
    timeout-minutes: 30
    # The environment's reviewers approve before this job starts; its secrets and the Azure
    # federated credential are only available to jobs in it.
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      SIGNING_CLIENT_VERSION: '1.0.146'
      SIGNING_CLIENT_SHA256: 7761e5d8f31e54b764da21d33cd8b0a2940e1b05526c7dfcb5e94b0431426f70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The current Temurin 17 release, not the runner's cached one: this JDK's runtime ships in the
      # installer. No Gradle cache: a cache written by another run is never restored into the
      # signing job.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: native/build

      # The Artifact Signing plugin for signtool, from Microsoft's NuGet package, pinned by version
      # and hash, and checked to be signed by Microsoft.
      - name: Signing tools
        run: |
          $pkg = "$env:RUNNER_TEMP\signing-client.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$env:SIGNING_CLIENT_VERSION/microsoft.artifactsigning.client.$env:SIGNING_CLIENT_VERSION.nupkg" -OutFile $pkg
          if ((Get-FileHash $pkg -Algorithm SHA256).Hash -ne $env:SIGNING_CLIENT_SHA256) { throw 'signing client package hash mismatch' }
          Expand-Archive $pkg "$env:RUNNER_TEMP\signing-client"
          $dlib = "$env:RUNNER_TEMP\signing-client\bin\x64\Azure.CodeSigning.Dlib.dll"
          $sig = Get-AuthenticodeSignature $dlib
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "signing plugin isn't signed by Microsoft" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'no x64 signtool.exe' }
          "SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      # Everything up to the app folder, before signing in, so the sign-in is used within minutes.
      - name: App
        run: ./gradlew.bat --no-daemon :app:createDistributable

      - name: Signing account details
        env:
          SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } |
            ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\metadata.json"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Signs the launcher, readsb.exe and rtlsdr-driver.exe, builds the MSI, signs it, and verifies
      # every signature (app/build.gradle.kts).
      - name: Sign and build the installer
        run: >-
          ./gradlew.bat --no-daemon :app:buildMsi -Psign
          "-Psigntool=$env:SIGNTOOL" "-PsigningDlib=$env:SIGNING_DLIB" "-PsigningMetadata=$env:RUNNER_TEMP\metadata.json"

      - name: Sign out
        if: ${{ always() }}
        run: |
          az logout 2>$null
          Remove-Item "$env:RUNNER_TEMP\metadata.json" -ErrorAction SilentlyContinue

      - name: Check the installer's signature
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $msi = 'Releases\ADS-B-Exchange-Feeder.msi'
          $sig = Get-AuthenticodeSignature $msi
          if ($sig.Status -ne 'Valid') { throw "signature: $($sig.Status)" }
          if ($sig.SignerCertificate.Subject -notmatch '^CN="?JETNET, L\.L\.C\.') { throw "signer: $($sig.SignerCertificate.Subject)" }
          if (-not $sig.TimeStamperCertificate) { throw 'no timestamp' }
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\Releases\ADS-B-Exchange-Feeder.msi.sha256", "$hash  ADS-B-Exchange-Feeder.msi`n")
          $runtime = Get-ChildItem app\build -Recurse -Filter release -File | Where-Object { $_.Directory.Name -eq 'runtime' } |
            Select-Object -First 1 | ForEach-Object { (Select-String 'JAVA_VERSION=' $_.FullName).Line }
          @('### Signed installer', '', '| | |', '|---|---|',
            "| Version | $env:VERSION |",
            "| Signer | $($sig.SignerCertificate.Subject) |",
            "| SHA-256 | ``$hash`` |",
            "| Bundled runtime | $runtime |") | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-signed
          path: |
            Releases/ADS-B-Exchange-Feeder.msi
            Releases/ADS-B-Exchange-Feeder.msi.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft release
    needs: [check, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-signed
          path: installer

      - name: Check the hash
        working-directory: installer
        run: sha256sum -c ADS-B-Exchange-Feeder.msi.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installer/ADS-B-Exchange-Feeder.msi

      # The previous release's notes, under a reminder with this installer's SHA-256, are the
      # starting point; the maintainer updates them and removes the reminder before publishing.
      # GitHub keeps several drafts for one tag, so a draft from an earlier run of this job is
      # replaced rather than joined by a second one. Published releases are never touched.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          hash=$(cut -d' ' -f1 installer/ADS-B-Exchange-Feeder.msi.sha256)
          {
            echo "> **Draft: update these notes for $VERSION, then delete this block.**"
            echo '>'
            echo "> SHA-256 of \`ADS-B-Exchange-Feeder.msi\`: \`$hash\`"
            echo
            gh release view --repo "$GITHUB_REPOSITORY" --json body --jq .body || :
          } > notes.md
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and .tag_name == $ENV.GITHUB_REF_NAME) | .id' |
            while read -r id; do
              echo "Deleting draft release $id from an earlier run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "ADS-B Exchange Desktop Feeder $VERSION (beta)" --notes-file notes.md \
            installer/ADS-B-Exchange-Feeder.msi installer/ADS-B-Exchange-Feeder.msi.sha256
