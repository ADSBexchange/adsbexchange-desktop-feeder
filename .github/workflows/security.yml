# Runs tools/security-scan.ps1 (gitleaks, osv-scanner, semgrep and syft, each in a container) on
# pull requests, on pushes to dev and master, and weekly, since new advisories appear for
# dependencies that haven't changed. Fails if the scan finds anything to act on. The summary goes
# on the run page; the summary, SBOM and raw scanner output are kept as an artifact.
name: Security scan

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The SBOM records the Java runtime the MSI bundles, read from this JDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Scan
        shell: pwsh
        run: ./tools/security-scan.ps1

      - name: Summary
        if: ${{ !cancelled() && hashFiles('security/scan-summary.md') != '' }}
        run: cat security/scan-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: security-scan
          path: |
            security/scan-summary.md
            security/sbom.cdx.json
            build/security-scan
          if-no-files-found: ignore
          retention-days: 30
